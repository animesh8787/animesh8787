name: Metrics

on:
  schedule:
    # every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------ #
      # The 3D isometric contribution calendar
      # ------------------------------------------------------------------ #
      - name: Isometric contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: animesh8787
          filename: assets/metrics.isocalendar.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ------------------------------------------------------------------ #
      # Language breakdown (bytes + recent-activity weighted). The _ignored
      # list keeps build/config noise (HTML dist folders, the setup.ps1 in
      # this repo, Dockerfiles) out of the mix.
      # ------------------------------------------------------------------ #
      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: animesh8787
          filename: assets/metrics.languages.svg
          base: ""
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_indepth: no
          plugin_languages_sections: most-used
          plugin_languages_ignored: >-
            html, css, scss, less, shell, powershell, dockerfile, makefile,
            batchfile, tex, mako, hcl, procfile, jupyter notebook

      # NOTE: the achievements plugin was removed - lowlighter/metrics@latest
      # currently hard-errors on it ("Projects (classic) is being deprecated"),
      # so it rendered an "Unexpected error" box on the profile. The coding-
      # habits card was removed too: it needs a few hundred commits to look
      # like anything and was never placed in the README.
